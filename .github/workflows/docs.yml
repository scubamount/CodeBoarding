name: CodeBoarding Documentation (Direct)

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: 'Repository URL to analyze (defaults to current repo)'
        required: false
        default: ''
        type: string
      source_branch:
        description: 'Source branch to analyze'
        required: false
        default: ''
        type: string
      target_branch:
        description: 'Target branch for documentation'
        required: false
        default: ''
        type: string
      output_directory:
        description: 'Output directory for documentation files'
        required: false
        default: '.codeboarding'
        type: string
      output_format:
        description: 'Output format for documentation'
        required: false
        default: '.md'
        type: choice
        options:
          - '.md'
          - '.mdx'
          - '.rst'
  push:
    branches:
      - master
      - main

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout CodeBoarding engine
        uses: actions/checkout@v4
        with:
          repository: CodeBoarding/CodeBoarding
          ref: ${{ github.sha }}
          path: codeboarding-engine
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: target-repo

      - name: Set branch variables
        id: set-branches
        # Untrusted event inputs arrive as environment variables, never spliced
        # into shell text, so shell metacharacters in a dispatch input stay data.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
          INPUT_SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          INPUT_TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          INPUT_REPOSITORY_URL: ${{ github.event.inputs.repository_url }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "source_branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "target_branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "repository_url=https://github.com/$REPO_SLUG" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_SOURCE_BRANCH" ] && [ -n "$INPUT_TARGET_BRANCH" ]; then
            echo "source_branch=$INPUT_SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "target_branch=$INPUT_TARGET_BRANCH" >> "$GITHUB_OUTPUT"
            echo "repository_url=${INPUT_REPOSITORY_URL:-https://github.com/$REPO_SLUG}" >> "$GITHUB_OUTPUT"
          else
            echo "source_branch=main" >> "$GITHUB_OUTPUT"
            echo "target_branch=main" >> "$GITHUB_OUTPUT"
            echo "repository_url=https://github.com/$REPO_SLUG" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv venv
        uses: actions/cache@v4
        with:
          path: codeboarding-engine/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('codeboarding-engine/pyproject.toml', 'codeboarding-engine/uv.lock') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-

      - name: Cache LSP servers and binaries
        uses: actions/cache@v4
        with:
          path: |
            codeboarding-engine/static_analyzer/servers/node_modules
            codeboarding-engine/static_analyzer/servers/bin
          key: lsp-servers-${{ runner.os }}-v1
          restore-keys: |
            lsp-servers-${{ runner.os }}-

      - name: Install Python dependencies
        working-directory: codeboarding-engine
        run: |
          uv venv --clear
          uv pip install -e .

      - name: Install LSP servers and binaries
        working-directory: codeboarding-engine
        run: |
          uv run python install.py --auto-install-npm

      - name: Run CodeBoarding analysis
        working-directory: codeboarding-engine
        timeout-minutes: 30
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
          PARSING_MODEL: ${{ secrets.PARSING_MODEL }}
          REPO_ROOT: ${{ github.workspace }}/codeboarding-engine/repos
          STATIC_ANALYSIS_CONFIG: ${{ github.workspace }}/codeboarding-engine/static_analysis_config.yml
          PROJECT_ROOT: ${{ github.workspace }}/codeboarding-engine
          DIAGRAM_DEPTH_LEVEL: '2'
          CACHING_DOCUMENTATION: 'false'
          ENABLE_MONITORING: 'false'
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          OUTPUT_DIR: ${{ github.event.inputs.output_directory }}
          REPO_URL: ${{ steps.set-branches.outputs.repository_url }}
          SOURCE_BRANCH: ${{ steps.set-branches.outputs.source_branch }}
          TARGET_BRANCH: ${{ steps.set-branches.outputs.target_branch }}
        run: |
          # Ensure repos directory exists
          mkdir -p repos

          # An empty dispatch input falls back to the documented default.
          OUTPUT_FORMAT="${OUTPUT_FORMAT:-.md}"
          OUTPUT_DIR="${OUTPUT_DIR:-.codeboarding}"

          echo "Generating docs for: $REPO_URL"
          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"
          echo "Output format: $OUTPUT_FORMAT"
          echo "Output directory: $OUTPUT_DIR"

          # Check if previous analysis exists in target repo for incremental updates
          EXISTING_ANALYSIS_DIR=""
          TARGET_ANALYSIS_DIR="$GITHUB_WORKSPACE/target-repo/$OUTPUT_DIR"
          if [ -f "$TARGET_ANALYSIS_DIR/analysis.json" ]; then
            echo "Found existing analysis - will attempt incremental update"
            EXISTING_ANALYSIS_DIR="$TARGET_ANALYSIS_DIR"
          else
            echo "No existing analysis found - will run full analysis"
          fi

          # A quoted heredoc passes the values as data: no shell expansion
          # reaches Python source, so a quote in an input cannot add statements.
          export EXISTING_ANALYSIS_DIR
          uv run python - <<'PY'
          import os

          from github_action import generate_analysis

          existing = os.environ.get("EXISTING_ANALYSIS_DIR") or None
          result_dir = generate_analysis(
              repo_url=os.environ["REPO_URL"],
              source_branch=os.environ["SOURCE_BRANCH"],
              target_branch=os.environ["TARGET_BRANCH"],
              extension=os.environ["OUTPUT_FORMAT"],
              output_dir=os.environ["OUTPUT_DIR"],
              existing_analysis_dir=existing,
          )
          print(f"Generated files in: {result_dir}")
          PY

      - name: Copy generated files to target repo
        id: copy-files
        env:
          OUTPUT_DIR: ${{ github.event.inputs.output_directory }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
        run: |
          OUTPUT_DIR="${OUTPUT_DIR:-.codeboarding}"
          OUTPUT_FORMAT="${OUTPUT_FORMAT:-.md}"
          ENGINE_TEMP=$(find codeboarding-engine/temp -maxdepth 1 -mindepth 1 -type d | head -1)

          if [ -z "$ENGINE_TEMP" ]; then
            echo "No temp directory found - analysis may have failed"
            exit 1
          fi

          echo "Found generated files in: $ENGINE_TEMP"
          ls -la "$ENGINE_TEMP"

          # Copy entire output directory to target repo, excluding logs
          mkdir -p "target-repo/$OUTPUT_DIR"
          cp -r "$ENGINE_TEMP"/* "target-repo/$OUTPUT_DIR/"
          
          # Remove logs directory if it exists
          if [ -d "target-repo/$OUTPUT_DIR/logs" ]; then
            echo "Removing logs directory..."
            rm -rf "target-repo/$OUTPUT_DIR/logs"
          fi

          # Count files for reporting
          json_count=$(find "target-repo/$OUTPUT_DIR" -name "*.json" -type f | wc -l)
          doc_count=$(find "target-repo/$OUTPUT_DIR" -name "*$OUTPUT_FORMAT" -type f | wc -l)

          echo "Copied $json_count JSON files and $doc_count doc files to target-repo/$OUTPUT_DIR/"
          echo "json_files_created=$json_count" >> $GITHUB_OUTPUT
          echo "markdown_files_created=$doc_count" >> $GITHUB_OUTPUT
          echo "output_directory=$OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Check for changes in target repo
        id: git-changes
        working-directory: target-repo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_git_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_git_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate architecture documentation
        if: steps.git-changes.outputs.has_git_changes == 'true'
        working-directory: target-repo
        env:
          OUTPUT_DIR: ${{ github.event.inputs.output_directory }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
        run: |
          OUTPUT_DIR="${OUTPUT_DIR:-.codeboarding}"
          output_format="${OUTPUT_FORMAT:-.md}"
          file_extension="${output_format}"

          mkdir -p docs/development
          echo "" > "docs/development/architecture${file_extension}"

          if [ -f "${OUTPUT_DIR}/on_boarding${file_extension}" ]; then
            echo "Found and adding: on_boarding${file_extension}"
            cat "${OUTPUT_DIR}/on_boarding${file_extension}" > "docs/development/architecture${file_extension}"
            echo "" >> "docs/development/architecture${file_extension}"
          fi

          for file in ${OUTPUT_DIR}/*${file_extension}; do
            if [ -f "$file" ] && [ "$(basename "$file")" != "on_boarding${file_extension}" ]; then
              filename=$(basename "$file")
              echo "Found and adding: $filename"
              echo "" >> "docs/development/architecture${file_extension}"
              cat "$file" >> "docs/development/architecture${file_extension}"
              echo "" >> "docs/development/architecture${file_extension}"
            fi
          done

      - name: Commit and push changes
        if: steps.git-changes.outputs.has_git_changes == 'true'
        working-directory: target-repo
        env:
          MARKDOWN_COUNT: ${{ steps.copy-files.outputs.markdown_files_created }}
          JSON_COUNT: ${{ steps.copy-files.outputs.json_files_created }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          REPO_URL: ${{ steps.set-branches.outputs.repository_url }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "docs: update codeboarding documentation

          Documentation files created/updated: ${MARKDOWN_COUNT}
          JSON files created/updated: ${JSON_COUNT}
          Output format: ${OUTPUT_FORMAT:-.md}
          Repository analyzed: ${REPO_URL}

          Generated directly in GitHub Actions (no external server).
          "
          git push
